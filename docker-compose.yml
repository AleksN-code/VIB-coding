services:
  # Міграції бази (Alembic): запускаються перед ботом і завершуються.
  # Вручну: docker compose run --rm migrate
  migrate:
    build: .
    restart: "no"
    # Кожен сервіс отримує лише свої секрети (значення Docker Compose бере з .env).
    # Міграціям потрібна тільки база.
    environment:
      DATABASE_URL: ${DATABASE_URL}
    # Локальні файли — щоб нові міграції працювали без перезбирання образу
    volumes:
      - ./app:/bot/app
      - ./migrations:/bot/migrations
      - ./alembic.ini:/bot/alembic.ini
    command: ["alembic", "upgrade", "head"]

  bot:
    build: .
    container_name: first-bot
    restart: unless-stopped
    # Бот стартує, лише коли міграції успішно застосовані
    depends_on:
      migrate:
        condition: service_completed_successfully

    # Режим розробки: локальна папка app підключена в контейнер,
    # і watchfiles перезапускає бота після зміни будь-якого .py файлу в ній.
    volumes:
      - ./app:/bot/app
    command: ["watchfiles", "--filter", "python", "python -m app.main", "app"]
    # Боту — токен Telegram і база; пароля адмінки він не отримує
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: ${DATABASE_URL}
      # На Windows/WSL 2 події зміни файлів не доходять у контейнер — перевіряємо зміни опитуванням.
      WATCHFILES_FORCE_POLLING: "true"

  # Backend API для web-адмінки (FastAPI): http://localhost:8000/docs
  api:
    build: .
    container_name: admin-api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # API — база й пароль адмінки (без BOT_TOKEN); Docker Compose бере значення з .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      WATCHFILES_FORCE_POLLING: "true"
    # Режим розробки: зміни в app/ та api/ підхоплюються без перезбирання образу
    volumes:
      - ./app:/bot/app
      - ./api:/bot/api
    command:
      ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000",
       "--reload", "--reload-dir", "api", "--reload-dir", "app"]
    # Лише на цьому ПК: 127.0.0.1 — з інших пристроїв у мережі API недоступний
    ports:
      - "127.0.0.1:8000:8000"

  # Web-адмінка (React + Vite): http://localhost:5173
  frontend:
    build: ./frontend
    container_name: admin-frontend
    restart: unless-stopped
    depends_on:
      - api
    # Жодних секретів: лише адреса API для проксі Vite (усередині мережі Docker)
    environment:
      API_URL: http://api:8000
    volumes:
      - ./frontend:/app
      # node_modules беремо з образу, а не з папки на ПК
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"

  # Пошук секретів (токенів, паролів) у файлах, які відстежує Git.
  # Не запускається разом із ботом — тільки вручну:
  #   docker compose run --rm secrets-scan
  secrets-scan:
    profiles: ["tools"]
    build:
      context: .
      dockerfile_inline: | # pragma: allowlist secret
        FROM python:3.12-slim
        RUN apt-get update \
            && apt-get install -y --no-install-recommends git \
            && rm -rf /var/lib/apt/lists/* \
            && pip install --no-cache-dir detect-secrets==1.5.0 \
            && git config --system --add safe.directory /code \
            && git config --system core.autocrlf true
    volumes:
      - .:/code
    working_dir: /code
    environment:
      # Не створювати __pycache__ у проєкті під час завантаження плагіна
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["sh", "-c"]
    # Перевіряє тільки файли з Git (тобто без .env) і порівнює знахідки з .secrets.baseline.
    command:
      - git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline && echo "detect-secrets - нових секретів не знайдено"
