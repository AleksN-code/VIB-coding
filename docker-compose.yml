services:
  bot:
    build: .
    container_name: first-bot
    env_file: .env
    restart: unless-stopped

    # Режим розробки: локальна папка app підключена в контейнер,
    # і watchfiles перезапускає бота після зміни будь-якого .py файлу в ній.
    volumes:
      - ./app:/bot/app
    command: ["watchfiles", "--filter", "python", "python -m app.main", "app"]
    environment:
      # На Windows/WSL 2 події зміни файлів не доходять у контейнер — перевіряємо зміни опитуванням.
      WATCHFILES_FORCE_POLLING: "true"

  # Пошук секретів (токенів, паролів) у файлах, які відстежує Git.
  # Не запускається разом із ботом — тільки вручну:
  #   docker compose run --rm secrets-scan
  secrets-scan:
    profiles: ["tools"]
    build:
      context: .
      dockerfile_inline: |
        FROM python:3.12-slim
        RUN apt-get update \
            && apt-get install -y --no-install-recommends git \
            && rm -rf /var/lib/apt/lists/* \
            && pip install --no-cache-dir detect-secrets==1.5.0 \
            && git config --system --add safe.directory /code
    volumes:
      - .:/code
    working_dir: /code
    environment:
      # Не створювати __pycache__ у проєкті під час завантаження плагіна
      PYTHONDONTWRITEBYTECODE: "1"
    entrypoint: ["sh", "-c"]
    # Перевіряє тільки файли з Git (тобто без .env) і порівнює знахідки з .secrets.baseline.
    command:
      - git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline && echo "detect-secrets - нових секретів не знайдено"
