# Налаштування Alembic — інструмента міграцій бази даних.
# Рядок підключення тут НЕ зберігається: migrations/env.py бере DATABASE_URL з .env.

[alembic]
script_location = migrations
# щоб міграції бачили пакет app (моделі SQLAlchemy)
prepend_sys_path = .
# імена файлів міграцій: 0001_initial.py, 0002_....py
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
datefmt = %Y-%m-%d %H:%M:%S
